name: NSE end-of-day prices

on:
  schedule:
    - cron: "32 13 * * 1-5"   # 19:02 IST
    - cron: "17 15 * * 1-5"   # 20:47 IST (retry if NSE was late)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/**", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: nse-eod
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python scripts/update_eod.py
      - name: Commit if changed
        run: |
          git config user.name "eod-bot"
          git config user.email "eod-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "EOD prices $(date -u +%F)" && git push
